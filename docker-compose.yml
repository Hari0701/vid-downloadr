services:
  backend:
    build: ./backend
    environment:
      # The frontend calls the API through its own origin, so CORS only needs
      # to allow direct browser access during development.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      DOWNLOAD_DIR: /data/downloads
      FILE_TTL_SECONDS: ${FILE_TTL_SECONDS:-3600}
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-3}
      MAX_FILESIZE_MB: ${MAX_FILESIZE_MB:-2048}
      PROXY: ${PROXY:-}
      COOKIES_FILE: ${COOKIES_FILE:-}
      INSTAGRAM_USERNAME: ${INSTAGRAM_USERNAME:-}
      INSTAGRAM_SESSION_FILE: ${INSTAGRAM_SESSION_FILE:-}
      INSTAGRAM_PASSWORD: ${INSTAGRAM_PASSWORD:-}
    volumes:
      - downloads:/data/downloads
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time — see the note in frontend/Dockerfile.
        BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  downloads:
